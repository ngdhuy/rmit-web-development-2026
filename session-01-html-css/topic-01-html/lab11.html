<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="text/icon" href="./img/favicon.ico" />
    <title>Form Advance</title>
</head>
<body>
    <h1>Form with method POST</h1>

    <form name="frmSignIn" action="./lab01.html" method="post">
        <fieldset>
            <legend>Sign In</legend>
            <div>
                <label for="us">Username:</label>
                <input type="text" id="us" name="us" placeholder="input username" />
            </div>
            <div>
                <label for="pw">Password:</label>
                <input type="password" id="pw" name="pw" placeholder="input username" />
            </div>
            <div>
                <button type="submit">Sign In</button>
            </div>
        </fieldset>        
    </form>

    <form name="frmSignUp" action="./lab01.html" enctype="multipart/form-data" method="post">
        <fieldset>
            <legend>Sign Up</legend>
            <div>
                <label for="us">Username:</label>
                <input type="text" id="us" name="us" placeholder="input username" />
            </div>
            <div>
                <label for="pw">Password</label>
                <input type="password" id="pw" name="pw" placeholder="input password" />
            </div>
            <div>
                <input type="checkbox" id="rm" name="rm" value="true" checked />
                <label for="rm">Is Sign-in and remember after Sign-up</label>
            </div>
            <div>
                <span>Role</span>
                <div>
                    <input type="radio" id="rdAdmin" name="rd" value="admin" />
                    <label for="rdAdmin">Admin role</label>
                </div>
                <div>
                    <input type="radio" id="rdUser" name="rd" value="user" checked />
                <label for="rdUser">User role</label>
                </div>
            </div>
            <div>
                <Label for="loc">Location</Label>
                <select id="loc" name="loc">
                    <optgroup label="Viet Nam">
                        <option value="SGN">Sai Gon</option>
                        <option value="HAN">Ha Noi</option>
                    </optgroup>
                    <option value="SIG" selected>Singapore</option>
                </select>
            </div>
            <div>
                <label for="color">Favorite Color</label>
                <input type="color" id="col" name="col" />
            </div>
            <div>
                <label for="dob">Birthday</label>
                <input type="date" id="dob" name="dob" />
            </div>
            <div>
                <label for="ft">Free time</label>
                <input type="datetime-local" id="ft" name="ft" />
            </div>
            <div>
                <label for="mail">Email</label>
                <input type="email" id="mail" name="mail" />
            </div>
            <div>
                <label for="tel">Telephone number</label>
                <input type="tel" id="tel" name="tel" />
            </div>
            <div>
                <label for="fb">Facebook URL</label>
                <input type="url" id="fb" name="fb" />
            </div>
            <div>
                <label for="ra">Range Age</label>
                <input type="range" id="ra" name="ra" min="18" max="50" />
            </div>
            <div>
                <label for="cv">Upload CV file</label>
                <input type="file" id="cv" name="cv" accept="image/*,.pdf" />
            </div>
            <div>
                <label for="note">Note</label>
                <textarea id="note" name="note"></textarea>
            </div>
            <div>
                <button type="submit">Sign Up</button>
                <button type="reset">Reset Form</button>
            </div>
        </fieldset>
    </form>
</body>
</html>
