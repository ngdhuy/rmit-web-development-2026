<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector - Element</title>
    <style type="text/css">
        /* CSS coding here */
        h1 {
            font-style: italic;
        }

        #footer {
            padding: 5px;
            background-color: #66ffcc;
        }

        .red-style {
            border: 1px solid #3366cc;
        }

        /* Grouping */
        h1, #footer, .red-style {
            color: #cc3366;
        }
    </style>
</head>
<body>
    <h1>Selector - Element</h1>

    <p>This is paragraph 1</p>
    <p>This is paragraph 2</p>
    <p class="red-style">This is paragraph 3</p>
    <p>This is paragraph 4</p>

    <div id="footer">Footer of pages</div>
</body>
</html>
