<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector - Class</title>
    <style type="text/css">
        /* CSS coding here */
        .red-style {
            background-color: #cc3366;
            color: #ffffff;
            font-size: 20pt;
        }

        .italic-style {
            font-style: italic;
            border: 2px solid #8855dd;
        }
    </style>
</head>
<body>
    <h1 class="red-style">Title of Document</h1>

    <p>This is paragraph 1</p>
    <p class="italic-style">This is paragraph 2</p>
    <p>This is paragraph 3</p>
    <p>This is paragraph 4</p>

    <div class="red-style italic-style">Footer of pages</div>
</body>
</html>
