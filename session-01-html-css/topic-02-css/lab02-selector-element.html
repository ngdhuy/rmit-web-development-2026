<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector - Element</title>
    <style type="text/css">
        /* CSS coding here */
        h1 { color: #cc3366; }

        p {
            background-color: #cc3366;
            color: #ffffff;
        }

        div { background-color: #3366cc; color: #ffffff; }
    </style>
</head>
<body>
    <h1>Selector - Element</h1>

    <p>This is paragraph 1</p>
    <p>This is paragraph 2</p>
    <p>This is paragraph 3</p>
    <p>This is paragraph 4</p>

    <div>Footer of pages</div>
</body>
</html>
